<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BriefRoom - Videoconferência P2P</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 10px; }
        .room-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        input { background: #333; color: #fff; }
        button { background: #4CAF50; color: white; cursor: pointer; }
        button:hover { background: #45a049; }
        .video-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            width: 100%;
        }
        video {
            width: 100%;
            max-width: 360px;
            height: 270px;
            background: #000;
            border-radius: 8px;
            border: 2px solid #333;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h2>BriefRoom P2P</h2>
    
    <div class="room-box" id="setup-box">
        <input type="text" id="roomInput" placeholder="Nome da Sala">
        <button onclick="entrarSala()">Entrar na Sala</button>
    </div>

    <div class="video-container">
        <div>
            <h3>Minha Câmara</h3>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div>
            <h3>Outra Pessoa</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        let localStream;
        let peerConnection;
        let websocket;
        let roomId;

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        async function entrarSala() {
            roomId = document.getElementById('roomInput').value.trim();
            if (!roomId) {
                alert('Por favor, escreva o nome da sala!');
                return;
            }

            document.getElementById('setup-box').style.display = 'none';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (err) {
                alert('Erro ao aceder à câmara/microfone: ' + err.message);
                return;
            }

            conectarSignaling();
        }

        function conectarSignaling() {
            websocket = new WebSocket(`wss://chamar.bmlimp8.workers.dev/ws?room=${roomId}`);

            websocket.onopen = () => {
                console.log('Ligado ao servidor de sinalização.');
                iniciarWebRTC();
            };

            websocket.onmessage = async (event) => {
                const message = JSON.parse(event.data);

                if (!peerConnection) iniciarWebRTC();

                try {
                    if (message.offer) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(message.offer));
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        websocket.send(JSON.stringify({ answer: answer }));
                    } else if (message.answer) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(message.answer));
                    } else if (message.ice) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(message.ice));
                    }
                } catch (err) {
                    console.error('Erro ao processar mensagem do WebSocket:', err);
                }
            };
        }

        function iniciarWebRTC() {
            if (peerConnection) return;

            peerConnection = new RTCPeerConnection(servers);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                const remoteVideo = document.getElementById('remoteVideo');
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    console.h?.('Vídeo remoto recebido com sucesso!');
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    websocket.send(JSON.stringify({ ice: event.candidate }));
                }
            };

            // Cria a oferta automaticamente assim que o PeerConnection for iniciado
            peerConnection.createOffer()
                .then(offer => peerConnection.setLocalDescription(offer))
                .then(() => {
                    websocket.send(JSON.stringify({ offer: peerConnection.localDescription }));
                })
                .catch(err => console.error('Erro ao criar oferta:', err));
        }
    </script>
</body>
</html>
