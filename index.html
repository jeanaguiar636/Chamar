<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BriefRoom - Videoconferência P2P</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 10px; }
        .room-box { margin-bottom: 20px; }
        input, button { padding: 10px; font-size: 16px; border-radius: 5px; border: none; margin: 5px; }
        button { background: #0070f3; color: white; cursor: pointer; }
        button:hover { background: #0051a2; }
        .video-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
        video { width: 400px; height: 300px; background: #000; border-radius: 10px; object-fit: cover; border: 2px solid #333; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>BriefRoom</h1>
    <div id="setup" class="room-box">
        <input type="text" id="roomInput" placeholder="Nome da Sala (ex: sala123)">
        <button onclick="joinRoom()">Entrar na Sala</button>
    </div>

    <div id="call-container" class="video-grid hidden">
        <div>
            <h3>Minha câmara</h3>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div>
            <h3>Outra pessoa</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        const wsUrl = "wss://chamar.bmlimp8.workers.dev/ws";
        let ws, localStream, peerConnection, roomId;
        
        const rtcConfig = {
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        };

        async function joinRoom() {
            roomId = document.getElementById('roomInput').value.trim();
            if (!roomId) return alert("Digite o nome da sala!");

            document.getElementById('setup').classList.add('hidden');
            document.getElementById('call-container').classList.remove('hidden');

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (err) {
                alert("Erro ao aceder à câmara/microfone: " + err.message);
                return;
            }

            ws = new WebSocket(`${wsUrl}?room=${roomId}`);

            ws.onmessage = async (event) => {
                const message = JSON.parse(event.data);

                if (!peerConnection) createPeerConnection();

                if (message.offer) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(message.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    ws.send(JSON.stringify({ answer }));
                } else if (message.answer) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(message.answer));
                } else if (message.ice) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(message.ice));
                    } catch (e) {
                        console.error("Erro ao adicionar ICE", e);
                    }
                }
            };

            ws.onopen = async () => {
                createPeerConnection();
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                ws.send(JSON.stringify({ offer }));
            };
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({ ice: event.candidate }));
                }
            };
        }
    </script>
</body>
</html>
