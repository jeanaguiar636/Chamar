<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BriefRoom - Videoconferência P2P</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 10px; }
        .room-box {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        input { background: #333; color: #fff; }
        button { background: #4CAF50; color: white; cursor: pointer; }
        button:hover { background: #45a049; }
        #status {
            margin-bottom: 15px;
            padding: 8px 12px;
            background: #222;
            border-radius: 4px;
            font-size: 14px;
            color: #ff9800;
            border: 1px solid #444;
            max-width: 360px;
            text-align: center;
        }
        .video-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            width: 100%;
        }
        video {
            width: 100%;
            max-width: 360px;
            height: 270px;
            background: #000;
            border-radius: 8px;
            border: 2px solid #333;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h2>BriefRoom P2P</h2>
    
    <div class="room-box" id="setup-box">
        <input type="text" id="roomInput" placeholder="Nome da Sala">
        <button onclick="entrarSala()">Entrar na Sala</button>
    </div>

    <div id="status">Aguardando entrar na sala...</div>

    <div class="video-container">
        <div>
            <h3>Minha Câmara</h3>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div>
            <h3>Outra Pessoa</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        let localStream;
        let peerConnection;
        let websocket;
        let roomId;

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function atualizarStatus(texto) {
            document.getElementById('status').innerText = texto;
        }

        async function entrarSala() {
            roomId = document.getElementById('roomInput').value.trim();
            if (!roomId) {
                alert('Por favor, escreva o nome da sala!');
                return;
            }

            document.getElementById('setup-box').style.display = 'none';
            atualizarStatus('A ligar à câmara e microfone...');

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (err) {
                atualizarStatus('Erro na câmara: ' + err.message);
                return;
            }

            conectarSignaling();
        }

        function conectarSignaling() {
            atualizarStatus('A ligar ao servidor WebSocket...');
            websocket = new WebSocket(`wss://chamar.bmlimp8.workers.dev/ws?room=${roomId}`);

            websocket.onopen = () => {
                atualizarStatus('Conectado! A iniciar ligação P2P...');
                iniciarWebRTC();
                
                // Aguarda 1 segundo e envia a oferta para garantir que o outro lado a recebe
                setTimeout(() => {
                    criarEEnviarOferta();
                }, 1000);
            };

            websocket.onerror = () => {
                atualizarStatus('Erro na conexão WebSocket.');
            };

            websocket.onmessage = async (event) => {
                const message = JSON.parse(event.data);

                if (!peerConnection) iniciarWebRTC();

                try {
                    if (message.offer) {
                        atualizarStatus('A receber chamada...');
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(message.offer));
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        websocket.send(JSON.stringify({ answer: answer }));
                    } else if (message.answer) {
                        atualizarStatus('Chamada aceite! Conectando...');
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(message.answer));
                    } else if (message.ice) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(message.ice));
                    }
                } catch (err) {
                    console.error('Erro no processamento da mensagem:', err);
                }
            };
        }

        function iniciarWebRTC() {
            if (peerConnection) return;

            peerConnection = new RTCPeerConnection(servers);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                const remoteVideo = document.getElementById('remoteVideo');
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    atualizarStatus('Vídeo e áudio conectados com sucesso!');
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    websocket.send(JSON.stringify({ ice: event.candidate }));
                }
            };
        }

        async function criarEEnviarOferta() {
            try {
                if (peerConnection.signalingState === "stable") {
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    websocket.send(JSON.stringify({ offer: offer }));
                    atualizarStatus('A procurar o outro participante...');
                }
            } catch (err) {
                console.error('Erro ao criar oferta:', err);
            }
        }
    </script>
</body>
</html>
