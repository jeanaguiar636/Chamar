<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BriefRoom - Videoconferência P2P</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 10px; }
        .menu-box {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input, button {
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        input { background: #333; color: #fff; width: 100%; box-sizing: border-box; }
        button { background: #4CAF50; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }
        .btn-secondary { background: #2196F3; }
        .btn-secondary:hover { background: #0b7dda; }
        #room-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }
        .room-item {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid #444;
        }
        .room-item:hover { background: #3a3a3a; border-color: #4CAF50; }
        #room-title-display {
            font-size: 18px;
            color: #4CAF50;
            margin-bottom: 5px;
            font-weight: bold;
        }
        #status {
            margin-bottom: 15px;
            padding: 8px 12px;
            background: #222;
            border-radius: 4px;
            font-size: 14px;
            color: #ff9800;
            border: 1px solid #444;
            max-width: 360px;
            text-align: center;
            display: none;
        }
        .video-container {
            display: none;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            width: 100%;
        }
        video {
            width: 100%;
            max-width: 360px;
            height: 270px;
            background: #000;
            border-radius: 8px;
            border: 2px solid #333;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h2>BriefRoom P2P</h2>
    
    <!-- Menu Inicial -->
    <div class="menu-box" id="menu-box">
        <h3>Criar Sala</h3>
        <input type="text" id="createRoomInput" placeholder="Nome da nova sala">
        <button onclick="criarSala()">Criar e Entrar</button>

        <hr style="border: 0; border-top: 1px solid #444; margin: 10px 0;">

        <h3>Salas Disponíveis</h3>
        <button class="btn-secondary" onclick="atualizarListaSalas()">Atualizar Lista</button>
        <div id="room-list">
            <span style="color: #888; font-size: 14px; text-align: center;">Clique em atualizar</span>
        </div>
    </div>

    <div id="room-title-display"></div>
    <div id="status">Aguardando...</div>

    <!-- Ecrã de Vídeo -->
    <div class="video-container" id="video-container">
        <div>
            <h3>Minha Câmara</h3>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div>
            <h3>Outra Pessoa</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        let localStream;
        let peerConnection;
        let websocket;
        let roomId;

        const WORKER_URL = 'https://chamar.bmlimp8.workers.dev';

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun.stunprotocol.org:3478' }
            ]
        };

        function atualizarStatus(texto) {
            const st = document.getElementById('status');
            st.style.display = 'block';
            st.innerText = texto;
        }

        async function atualizarListaSalas() {
            const listDiv = document.getElementById('room-list');
            listDiv.innerHTML = '<span style="color: #aaa; font-size: 14px; text-align: center;">A procurar...</span>';
            
            try {
                const response = await fetch(`${WORKER_URL}/rooms`);
                const rooms = await response.json();

                if (rooms.length === 0) {
                    listDiv.innerHTML = '<span style="color: #888; font-size: 14px; text-align: center;">Nenhuma sala ativa</span>';
                    return;
                }

                listDiv.innerHTML = '';
                rooms.forEach(room => {
                    const div = document.createElement('div');
                    div.className = 'room-item';
                    div.innerHTML = `<span>🚪 ${room}</span> <span style="color: #4CAF50; font-size: 12px; font-weight: bold;">Entrar &rarr;</span>`;
                    div.onclick = () => entrarNaSala(room);
                    listDiv.appendChild(div);
                });
            } catch (err) {
                listDiv.innerHTML = '<span style="color: #ff5252; font-size: 14px; text-align: center;">Erro ao carregar</span>';
            }
        }

        async function criarSala() {
            const roomName = document.getElementById('createRoomInput').value.trim();
            if (!roomName) {
                alert('Escreva o nome da sala!');
                return;
            }
            entrarNaSala(roomName);
        }

        async function entrarNaSala(nomeSala) {
            roomId = nomeSala;
            document.getElementById('menu-box').style.display = 'none';
            document.getElementById('video-container').style.display = 'flex';
            document.getElementById('room-title-display').innerText = `Sala: ${roomId}`;
            atualizarStatus('A ligar à câmara...');

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (err) {
                alert('Erro na câmara/microfone: ' + err.message);
                return;
            }

            conectarSignaling();
        }

        function conectarSignaling() {
            atualizarStatus(`Conectando à sala "${roomId}"...`);
            websocket = new WebSocket(`${WORKER_URL}/ws?room=${roomId}`);

            websocket.onopen = () => {
                atualizarStatus('Ligado ao servidor! Estabelecendo P2P...');
                iniciarWebRTC();
                setTimeout(() => criarEEnviarOferta(), 1200);
            };

            websocket.onerror = () => {
                atualizarStatus('Erro na conexão WebSocket.');
            };

            websocket.onclose = () => {
                atualizarStatus('A sala foi fechada.');
            };

            websocket.onmessage = async (event) => {
                const message = JSON.parse(event.data);
                if (!peerConnection) iniciarWebRTC();

                try {
                    if (message.offer) {
                        atualizarStatus('A receber chamada de outro participante...');
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(message.offer));
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        websocket.send(JSON.stringify({ answer: answer }));
                    } else if (message.answer) {
                        atualizarStatus('Resposta recebida! A conectar vídeo...');
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(message.answer));
                    } else if (message.ice) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(message.ice));
                    }
                } catch (err) {
                    console.error('Erro P2P:', err);
                }
            };
        }

        function iniciarWebRTC() {
            if (peerConnection) return;

            peerConnection = new RTCPeerConnection(servers);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            // Direciona o vídeo do outro telemóvel exatamente para a caixa de baixo (remoteVideo)
            peerConnection.ontrack = (event) => {
                const remoteVideo = document.getElementById('remoteVideo');
                if (event.streams && event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    atualizarStatus('Vídeo conectado com sucesso!');
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    websocket.send(JSON.stringify({ ice: event.candidate }));
                }
            };
        }

        async function criarEEnviarOferta() {
            try {
                if (peerConnection.signalingState === "stable") {
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    websocket.send(JSON.stringify({ offer: offer }));
                    atualizarStatus('Aguardando o outro telemóvel...');
                }
            } catch (err) {
                console.error('Erro oferta:', err);
            }
        }
    </script>
</body>
</html>
